<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقرير ملف الإنجاز وشواهد الأداء الوظيفي</title>
<link rel="stylesheet" href="css/style.css?v=20260406">
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#6C3CF7; --brand2:#0E7490;
    --green:#047857; --gold:#B45309; --red:#DC2626; --soft:#f9fafb;
  }
  body{background:#eceef3}
  .rep-toolbar{
    position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);
  }
  .rep-toolbar h2{font-size:15px;font-weight:800;color:var(--ink)}
  .rep-btn{padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;border:none}
  .rep-btn.print{background:linear-gradient(135deg,var(--brand),#A855F7);color:#fff}
  .rep-btn.back{background:#eef;border:1px solid #dde;color:var(--brand)}
  .sheet{
    max-width:820px;margin:22px auto;background:#fff;color:var(--ink);
    padding:0;border-radius:8px;box-shadow:0 6px 30px rgba(0,0,0,.08);overflow:hidden;
    font-family:'Segoe UI',Tahoma,sans-serif;
  }
  .pad{padding:32px 40px}
  .sec-title{font-size:17px;font-weight:800;color:var(--ink);margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--brand);display:flex;gap:8px;align-items:center}
  /* غلاف */
  .cover{background:linear-gradient(135deg,#6C3CF7,#0E7490);color:#fff;padding:60px 40px;text-align:center}
  .cover .badge-line{display:inline-block;background:rgba(255,255,255,.15);padding:6px 16px;border-radius:30px;font-size:12.5px;margin-bottom:26px}
  .cover h1{font-size:26px;font-weight:900;line-height:1.5;margin:0 0 30px}
  .cover-grid{display:inline-grid;grid-template-columns:auto auto;gap:12px 30px;text-align:right;margin-top:10px;font-size:15px}
  .cover-grid .lbl{opacity:.8}
  .cover-grid .val{font-weight:800}
  .cover-note{margin-top:32px;font-size:12.5px;opacity:.9;background:rgba(255,255,255,.12);display:inline-block;padding:8px 18px;border-radius:10px}
  /* ملخص */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--soft)}
  .kpi .n{font-size:26px;font-weight:900;color:var(--ink)}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
  .readiness{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;background:var(--soft)}
  .readiness .big{font-size:40px;font-weight:900;color:var(--brand)}
  .bar{height:12px;background:#e9ecf3;border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px}
  .fill-green{background:linear-gradient(90deg,#10B981,#059669)}
  .fill-teal{background:linear-gradient(90deg,#06B6D4,#0284C7)}
  .fill-gold{background:linear-gradient(90deg,#F59E0B,#D97706)}
  .fill-red{background:linear-gradient(90deg,#EF4444,#DC2626)}
  /* جدول المعايير */
  table.crit{width:100%;border-collapse:collapse;font-size:12.5px}
  table.crit th,table.crit td{border:1px solid var(--line);padding:9px 10px;text-align:center}
  table.crit th{background:#f1f0fb;color:var(--ink);font-weight:800}
  table.crit td.name{text-align:right;font-weight:600}
  .stat-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .st-done{background:rgba(4,120,87,.12);color:var(--green)}
  .st-good{background:rgba(14,116,144,.12);color:var(--brand2)}
  .st-need{background:rgba(180,83,9,.12);color:var(--gold)}
  .st-none{background:rgba(107,114,128,.12);color:var(--muted)}
  /* شواهد */
  .crit-block{margin-bottom:22px}
  .crit-block h4{font-size:14px;font-weight:800;color:var(--brand);margin:0 0 10px;padding:8px 12px;background:#f5f3ff;border-radius:8px}
  .ev{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:14px}
  .ev .thumb{width:78px;height:78px;flex:none;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#f3f4f6}
  .ev .ico{width:78px;height:78px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#f3f4f6;border:1px solid var(--line)}
  .ev .body{flex:1;min-width:0}
  .ev .t{font-weight:800;color:var(--ink);font-size:13.5px}
  .ev .meta{font-size:11.5px;color:var(--muted);margin:4px 0;display:flex;gap:14px;flex-wrap:wrap}
  .ev .desc{font-size:12.5px;color:#374151;margin:6px 0}
  .ev .impact{font-size:12px;background:rgba(4,120,87,.06);border-right:3px solid var(--green);padding:5px 9px;border-radius:6px;color:#065f46}
  .ev .link{font-size:11.5px;color:var(--brand2);word-break:break-all;margin-top:5px}
  .empty-note{font-size:12.5px;color:var(--muted);font-style:italic;padding:8px 12px}
  /* تحتاج تعديل */
  .fix{border:1px solid rgba(180,83,9,.3);background:rgba(245,158,11,.05);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .fix .t{font-weight:800;font-size:13px;color:var(--ink)}
  .fix .note{font-size:12.5px;color:#7c2d12;background:rgba(245,158,11,.1);padding:6px 10px;border-radius:6px;margin-top:6px}
  /* ملاحظات المدير */
  .mnote{border-right:3px solid var(--brand);background:#f7f5ff;padding:8px 12px;border-radius:6px;margin-bottom:8px;font-size:12.5px}
  .mnote .head{font-weight:700;color:var(--brand);font-size:12px;margin-bottom:2px}
  /* ختام */
  .closing{text-align:center;padding:20px 0}
  .closing .official{font-size:13.5px;color:#374151;background:var(--soft);border:1px dashed var(--brand);border-radius:12px;padding:16px;margin-bottom:34px;line-height:1.7}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:right;font-size:13px}
  .sign .box{border:1px solid var(--line);border-radius:12px;padding:16px}
  .sign .sig-line{margin-top:40px;border-top:1px solid var(--muted);padding-top:6px;color:var(--muted);font-size:12px}

  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff}
    .rep-toolbar{display:none}
    .sheet{box-shadow:none;margin:0;max-width:none;border-radius:0}
    .section{page-break-inside:avoid}
    .cover{page-break-after:always}
    .closing-page{page-break-before:always}
    .ev,.fix,.crit-block{page-break-inside:avoid}
  }
</style>
</head>
<body>

<div class="rep-toolbar">
  <h2>📄 تقرير ملف الإنجاز وشواهد الأداء الوظيفي</h2>
  <div style="display:flex;gap:10px">
    <button class="rep-btn back" onclick="window.location.href='portfolio.html'">← رجوع لملف الإنجاز</button>
    <button class="rep-btn print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<script src="js/supabase-config.js"></script>
<script src="js/cloud-db.js"></script>
<script src="js/portfolio-criteria.js"></script>
<script src="js/app.js"></script>
<script>
const teacher = checkAuth();
let evidences = getTeacherEvidences(teacher.id || 1);

function fillClass(pct){ return pct>=80?'fill-green':pct>=50?'fill-teal':pct>=25?'fill-gold':'fill-red'; }
function critStatusLabel(st){
  if (st.approved === 0 && st.total === 0) return {t:'لا توجد شواهد', c:'st-none'};
  if (st.coveragePct >= 80) return {t:'مكتمل', c:'st-done'};
  if (st.coveragePct >= 50) return {t:'جيد', c:'st-good'};
  if (st.approved > 0)      return {t:'يحتاج دعم', c:'st-need'};
  return {t:'لا توجد شواهد', c:'st-none'};
}
function esc(s){ return (s||'').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function schoolYear(){
  const d = new Date(); const y = d.getFullYear(); const m = d.getMonth();
  // العام الدراسي يبدأ تقريباً في أغسطس
  return m >= 7 ? `${y} / ${y+1}` : `${y-1} / ${y}`;
}

function render() {
  const tot = statusTotals(evidences);
  const pct = portfolioCompletion(evidences);
  const today = new Date().toLocaleDateString('ar-SA');
  const approved = evidences.filter(e => e.status === 'approved');
  const needFix  = evidences.filter(e => e.status === 'needs_edit');
  const withNotes = evidences.filter(e => (e.managerNote||'').trim());

  // 1) الغلاف
  const cover = `
  <div class="cover section">
    <div class="badge-line">مؤشر جاهزية — وليس درجة أداء وظيفي رسمية</div>
    <h1>تقرير ملف الإنجاز<br>وشواهد الأداء الوظيفي</h1>
    <div class="cover-grid">
      <span class="lbl">اسم المعلم</span><span class="val">${esc(teacher.name||'—')}</span>
      <span class="lbl">المادة</span><span class="val">${esc(teacher.subject||'—')}</span>
      <span class="lbl">المدرسة</span><span class="val">${esc(teacherSchool(teacher))}</span>
      <span class="lbl">العام الدراسي</span><span class="val">${schoolYear()}</span>
      <span class="lbl">تاريخ إنشاء التقرير</span><span class="val">${today}</span>
    </div>
    <div class="cover-note">🛈 هذا مؤشر جاهزية لملف الشواهد يساعد المدير، والتقييم النهائي قراره.</div>
  </div>`;

  // 2) الملخص العام
  const summary = `
  <div class="pad section">
    <h3 class="sec-title">📊 الملخص العام</h3>
    <div class="readiness">
      <div class="big">${pct}%</div>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">مؤشر اكتمال ملف الأداء (تغطية الشواهد المعتمدة)</div>
        <div class="bar"><i class="${fillClass(pct)}" style="width:${pct}%"></i></div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n">${tot.total}</div><div class="l">إجمالي الشواهد</div></div>
      <div class="kpi"><div class="n" style="color:var(--green)">${tot.approved}</div><div class="l">✅ معتمدة</div></div>
      <div class="kpi"><div class="n" style="color:var(--brand2)">${tot.submitted}</div><div class="l">📤 مرسلة للمراجعة</div></div>
      <div class="kpi"><div class="n" style="color:var(--gold)">${tot.needs_edit}</div><div class="l">✏️ تحتاج تعديل</div></div>
      <div class="kpi"><div class="n" style="color:var(--red)">${tot.rejected}</div><div class="l">❌ مرفوضة</div></div>
      <div class="kpi"><div class="n" style="color:var(--muted)">${tot.draft}</div><div class="l">📝 مسودات</div></div>
    </div>
  </div>`;

  // 3) جدول المعايير الـ 11
  const rows = PERFORMANCE_CRITERIA.map(c => {
    const st = criterionStats(evidences, c.id);
    const pending = st.submitted + st.needs_edit + st.draft;
    const sl = critStatusLabel(st);
    return `<tr>
      <td class="name">${c.order}. ${esc(c.title)}</td>
      <td>${c.weight}%</td>
      <td><strong>${st.coveragePct}%</strong></td>
      <td>${st.approved}</td>
      <td>${pending}</td>
      <td><span class="stat-pill ${sl.c}">${sl.t}</span></td>
    </tr>`;
  }).join('');
  const critTable = `
  <div class="pad section">
    <h3 class="sec-title">📋 جدول عناصر التقييم الـ 11</h3>
    <table class="crit">
      <thead><tr><th>المعيار</th><th>الوزن</th><th>التغطية</th><th>معتمدة</th><th>معلّقة</th><th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;

  // 4) الشواهد المعتمدة مرتبة حسب المعيار
  const approvedBlocks = PERFORMANCE_CRITERIA.map(c => {
    const list = approved.filter(e => Number(e.criterionId) === c.id);
    const inner = list.length ? list.map(evCard).join('') :
      `<div class="empty-note">لا توجد شواهد معتمدة لهذا المعيار.</div>`;
    return `<div class="crit-block"><h4>${c.order}. ${esc(c.title)} (${c.weight}%)</h4>${inner}</div>`;
  }).join('');
  const approvedSec = `
  <div class="pad section">
    <h3 class="sec-title">✅ الشواهد المعتمدة (مرتبة حسب المعيار)</h3>
    ${approvedBlocks}
  </div>`;

  // 5) الشواهد التي تحتاج تعديل
  const fixSec = `
  <div class="pad section">
    <h3 class="sec-title">✏️ شواهد تحتاج تعديل</h3>
    ${needFix.length ? needFix.map(e => {
      const c = criterionById(e.criterionId);
      const rd = e.reviewedAt ? new Date(e.reviewedAt).toLocaleDateString('ar-SA') : '—';
      return `<div class="fix">
        <div class="t">${esc(e.title)}</div>
        <div class="ev-meta" style="font-size:11.5px;color:var(--muted);margin-top:3px">📌 ${c?c.order+'. '+esc(c.title):'—'} • 📅 تاريخ المراجعة: ${rd}</div>
        ${(e.managerNote||'').trim() ? `<div class="note">🏫 ملاحظة المدير: ${esc(e.managerNote)}</div>` : ''}
      </div>`;
    }).join('') : `<div class="empty-note">لا توجد شواهد تحتاج تعديل.</div>`}
  </div>`;

  // 6) ملاحظات المدير (غير الفارغة فقط)
  const notesSec = `
  <div class="pad section">
    <h3 class="sec-title">🏫 ملاحظات المدير</h3>
    ${withNotes.length ? withNotes.map(e => {
      const c = criterionById(e.criterionId);
      const sm = evidenceStatusMeta(e.status);
      return `<div class="mnote">
        <div class="head">${esc(e.title)} — ${c?c.order+'. '+esc(c.title):''} <span style="font-weight:600;color:var(--muted)">(${sm.label})</span></div>
        ${esc(e.managerNote)}
      </div>`;
    }).join('') : `<div class="empty-note">لا توجد ملاحظات من المدير.</div>`}
  </div>`;

  // 7) صفحة ختامية
  const closing = `
  <div class="pad closing-page section">
    <div class="closing">
      <h3 class="sec-title" style="justify-content:center">📌 خاتمة التقرير</h3>
      <div class="official">
        هذا التقرير يعرض <strong>مؤشر جاهزية ملف الشواهد</strong> ونسبة تغطيتها لعناصر تقييم الأداء الوظيفي،
        <strong>ولا يُعد درجة أداء وظيفي نهائية</strong>. التقييم النهائي قرار مدير المدرسة.
      </div>
      <div class="sign">
        <div class="box">
          <div>مدير المدرسة: <strong>${esc(managerName())}</strong></div>
          <div style="margin-top:6px">المدرسة: <strong>${esc(teacherSchool(teacher))}</strong></div>
          <div style="margin-top:6px">التاريخ: <strong>${today}</strong></div>
          <div class="sig-line">التوقيع</div>
        </div>
        <div class="box">
          <div>المعلم: <strong>${esc(teacher.name||'—')}</strong></div>
          <div style="margin-top:6px">المادة: <strong>${esc(teacher.subject||'—')}</strong></div>
          <div style="margin-top:6px">العام الدراسي: <strong>${schoolYear()}</strong></div>
          <div class="sig-line">التوقيع</div>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById('sheet').innerHTML =
    cover + summary + critTable + approvedSec + fixSec + notesSec + closing;
}

// بطاقة شاهد معتمد (مصغّرة للصور)
function evCard(e) {
  const tm = evidenceTypeMeta(e.evidenceType);
  const isImg = e.evidenceType === 'image' && e.fileUrl;
  const thumb = isImg
    ? `<img class="thumb" src="${e.fileUrl}" alt="مصغّرة">`
    : `<div class="ico">${tm.icon}</div>`;
  const link = (e.fileUrl && !isImg)
    ? `<div class="link">🔗 <a href="${e.fileUrl}" target="_blank">${esc(e.fileUrl.length>90?e.fileUrl.slice(0,90)+'…':e.fileUrl)}</a></div>` : '';
  return `<div class="ev">
    ${thumb}
    <div class="body">
      <div class="t">${esc(e.title)}</div>
      <div class="meta">
        <span>🏷️ ${tm.label}</span>
        ${e.evidenceDate?`<span>📅 ${esc(e.evidenceDate)}</span>`:''}
      </div>
      ${e.description?`<div class="desc">${esc(e.description)}</div>`:''}
      ${e.impactNote?`<div class="impact">📈 الأثر: ${esc(e.impactNote)}</div>`:''}
      ${link}
    </div>
  </div>`;
}

function managerName() {
  const m = JSON.parse(localStorage.getItem('currentManager') || 'null');
  if (m && m.school === teacher.school) return m.name;
  const managers = JSON.parse(localStorage.getItem('managers') || '[]');
  const found = managers.find(x => (x.school||'') === (teacher.school||''));
  return found ? found.name : '__________________';
}

// مزامنة سحابية أفضل جهد ثم إعادة الرسم
(async function init(){
  render();
  if (window.cloudDB && cloudDB.isEnabled()) {
    try {
      const rows = await cloudDB.listEvidencesByTeacher(teacher.id || 1);
      if (Array.isArray(rows)) {
        evidences = rows.map(r => ({
          id: r.id, teacherId: r.teacher_id, criterionId: r.criterion_id,
          title: r.title, description: r.description, evidenceDate: r.evidence_date,
          evidenceType: r.evidence_type, fileUrl: r.file_url, impactNote: r.impact_note,
          status: r.status, managerNote: r.manager_note, reviewedAt: r.reviewed_at
        }));
        render();
      }
    } catch (e) { console.warn('report sync failed', e); }
  }
})();
</script>
</body>
</html>
