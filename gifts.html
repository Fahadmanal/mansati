<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصتي — الهدايا والمكافآت</title>
  <link rel="stylesheet" href="css/style.css?v=20260406">
</head>
<body>
<div id="sidebar-container"></div>
<div class="main-content">
  <div class="topbar">
    <div class="topbar-title">
      <h1>🎁 الهدايا والمكافآت</h1>
      <p>مكافآت بالنقاط لتحفيز الطلاب — يمكنك تعديل القائمة لتناسب فصلك</p>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-primary" style="padding:10px 18px;font-size:13px" onclick="openModal('modal-add-gift')">+ هدية جديدة</button>
    </div>
  </div>

  <div class="page">
    <div class="card" style="margin-bottom:22px">
      <div class="card-body" style="padding:18px 22px">
        <p style="font-size:13px;color:var(--text2);line-height:1.6;margin:0">
          اربط منح الهدايا بنقاط الطلاب أثناء التدريس. القائمة تُحفظ في المتصفح ويمكنك إضافة أو حذف العناصر أدناه.
        </p>
      </div>
    </div>
    <div class="gifts-page-grid" id="gifts-grid"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-add-gift">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🎁 إضافة هدية</div>
      <div class="modal-close" onclick="closeModal('modal-add-gift')">✕</div>
    </div>
    <div id="gift-alert" class="hidden"></div>
    <div class="form-group">
      <label class="form-label">اسم الهدية</label>
      <input type="text" class="form-input" id="gift-name" placeholder="مثال: شهادة تقدير">
    </div>
    <div class="form-group">
      <label class="form-label">النقاط المطلوبة</label>
      <input type="number" class="form-input" id="gift-points" min="1" value="50">
    </div>
    <div class="form-group">
      <label class="form-label">وصف</label>
      <input type="text" class="form-input" id="gift-desc" placeholder="متى تُمنح؟">
    </div>
    <div class="form-group">
      <label class="form-label">أيقونة (رمز تعبيري)</label>
      <input type="text" class="form-input" id="gift-icon" placeholder="🎁" maxlength="4">
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button type="button" class="btn btn-primary" style="flex:1" onclick="addGift()">حفظ</button>
      <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeModal('modal-add-gift')">إلغاء</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const teacher = checkAuth();
document.getElementById('sidebar-container').innerHTML = getSidebar('gifts');

function loadGifts() {
  const gifts = JSON.parse(localStorage.getItem('gifts') || '[]');
  const grid = document.getElementById('gifts-grid');
  if (!gifts.length) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state"><div class="empty-icon">🎁</div><p>لا توجد هدايا بعد</p><small>أضف مكافآت تناسب طلابك</small></div></div>`;
    return;
  }
  grid.innerHTML = gifts.map(g => `
    <div class="gift-card">
      <div class="gift-icon">${g.icon || '🎁'}</div>
      <div class="gift-name">${g.name}</div>
      <div class="gift-pts">${g.points} نقطة</div>
      <div class="gift-desc">${g.desc || ''}</div>
      <button type="button" class="btn btn-secondary" style="margin-top:14px;width:100%;padding:8px;font-size:12px" onclick="removeGift(${g.id})">حذف</button>
    </div>
  `).join('');
}

function addGift() {
  const name = document.getElementById('gift-name').value.trim();
  const points = parseInt(document.getElementById('gift-points').value, 10) || 0;
  const desc = document.getElementById('gift-desc').value.trim();
  const icon = document.getElementById('gift-icon').value.trim() || '🎁';
  if (!name || points < 1) { showAlert('gift-alert', 'أدخل اسماً وعدد نقاط صحيحاً', 'error'); return; }
  const gifts = JSON.parse(localStorage.getItem('gifts') || '[]');
  gifts.push({ id: Date.now(), name, points, desc, icon });
  localStorage.setItem('gifts', JSON.stringify(gifts));
  closeModal('modal-add-gift');
  document.getElementById('gift-name').value = '';
  document.getElementById('gift-desc').value = '';
  document.getElementById('gift-icon').value = '';
  document.getElementById('gift-points').value = '50';
  loadGifts();
}

function removeGift(id) {
  if (!confirm('حذف هذه الهدية؟')) return;
  const gifts = JSON.parse(localStorage.getItem('gifts') || '[]').filter(g => g.id !== id);
  localStorage.setItem('gifts', JSON.stringify(gifts));
  loadGifts();
}

loadGifts();
</script>
</body>
</html>
